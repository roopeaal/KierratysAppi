packages:
  - mobile/*
  - backend/*
  - shared/*

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Historical CLI-only Zod security guard; CLI58.1.19 no longer declares Zod,
# so this selector is currently inert and retained with the frozen lock values.
# Tests exercise actual JSON schemas and explicit injection of declared app Zod4.
overrides:
  '@expo/cli>zod': 4.6.7

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
